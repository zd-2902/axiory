name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev
      - run: uv run python -c "import importlib.util; assert importlib.util.find_spec('pymupdf') is None"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Runtime network namespace is isolated; dependency setup above may use the network.
      - run: sh scripts/offline-ci.sh .venv/bin/pytest
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-demo
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-semantic-eval
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-eval
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-real-eval --dry-run
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-real-eval --config datasets/multilingual/pilot-config.json --output datasets/evaluation-real/legacy-ci
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-real-eval --replay datasets/evaluation-real/legacy-ci
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-real-eval --config datasets/multilingual/pilot-config-v2.json --output datasets/evaluation-real/v2-ci
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-real-eval --replay datasets/evaluation-real/v2-ci
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-real-eval --all-offline --output datasets/evaluation-real/ci
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-real-eval --replay datasets/evaluation-real/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-layout-evaluation
          path: |
            datasets/evaluation/
            datasets/evaluation-semantic/
            datasets/evaluation-real/
          if-no-files-found: warn
          retention-days: 14
  experimental-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --extra experimental-pymupdf
      - run: sh scripts/offline-ci.sh .venv/bin/pytest
      - run: sh scripts/offline-ci.sh .venv/bin/axiory-parser-benchmark --allow-experimental-pymupdf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-multi-parser-evaluation
          path: datasets/evaluation-parsers/
          if-no-files-found: warn
          retention-days: 14

  optional-openai-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --dev --extra llm-openai
      # In-memory HTTP transport; no API key, secrets or live network call.
      - run: sh scripts/offline-ci.sh .venv/bin/pytest tests/test_openai_adapter.py
