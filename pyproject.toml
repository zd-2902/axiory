[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "axiory"
version = "0.1.0"
description = "Evidence-first insurance intelligence; synthetic foundation demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pypdf>=6.19,<7", "reportlab>=4.4,<5"]

[project.optional-dependencies]
llm-openai = ["openai>=2.0,<3"]
experimental-pymupdf = ["pymupdf>=1.26,<2"]

[project.scripts]
axiory-semantic-eval = "axiory.evaluation.semantic:main"
axiory-demo = "axiory.demo:main"
axiory-eval = "axiory.evaluation.runner:main"
axiory-parser-benchmark = "axiory.evaluation.multi_parser:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
