[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "axiory"
version = "0.1.0"
description = "Evidence-first insurance intelligence; synthetic foundation demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pypdf>=6.19,<7"]

[project.scripts]
axiory-demo = "axiory.demo:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
